<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ankara Gezi Rehberi - Gezi Rotası</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/style.css">
    <!-- Google SEO & Yapısal Veri -->
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://dogamanzara243-hue.github.io/gezi-rotasi-antalya/">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "TouristAttraction",
      "name": "Antalya",
      "description": "İstanbul gezi rehberi, ulaşım, otel ve restoran önerileri.",
      "url": "https://dogamanzara243-hue.github.io/gezi-rotasi-antalya/"
    }
    </script>

</head>
<body class="min-h-screen flex flex-col justify-between">
      <header class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-slate-200/80 shadow-xs transition-all">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <nav class="flex items-center space-x-2 sm:space-x-3 text-sm font-medium">
                <a href="javascript:history.back()" class="flex items-center text-slate-600 hover:text-theme transition-colors py-1 px-2.5 rounded-lg hover:bg-slate-100" title="Önceki Sayfaya Dön">
                    <i class="fa-solid fa-arrow-left mr-2"></i>
                    <span class="hidden sm:inline">Önceki Sayfa</span>
                </a>
                <span class="text-slate-300">/</span>
                <a href="https://dogamanzara243-hue.github.io/gezi-rotasi/" class="flex items-center text-slate-600 hover:text-theme transition-colors p-1.5 rounded-lg hover:bg-slate-100" title="Ana Sayfaya Dön">
                    <i class="fa-solid fa-house"></i>
                    <span class="ml-1.5 hidden md:inline">Ana Sayfa</span>
                </a>
                <span class="text-slate-300">/</span>
                <span id="breadcrumb-city" class="text-slate-500 font-normal">İstanbul</span>
                <span class="text-slate-300">/</span>
                <span id="breadcrumb-title" class="text-theme-dark font-semibold truncate max-w-[140px] sm:max-w-none"></span>
            </nav>

            <div class="flex items-center space-x-1 sm:space-x-2">
                <button id="btn-favorite" class="p-2 text-slate-500 hover:text-rose-500 hover:bg-rose-50 rounded-full transition-all" title="Favorilere Ekle">
                    <i class="fa-regular fa-heart text-lg"></i>
                </button>
                <button id="btn-share" class="p-2 text-slate-500 hover:text-theme hover:bg-slate-100 rounded-full transition-all" title="Sayfayı Paylaş">
                    <i class="fa-solid fa-share-nodes text-lg"></i>
                </button>
            </div>
        </div>
    </header>

  <div class="max-w-7xl mx-auto px-4 w-full pt-4">
    <div class="ad-banner-top"><span>— Reklam Alanı (970x90) —</span></div>
  </div>

  <main class="max-w-7xl mx-auto px-4 flex-grow w-full py-4">
    <section id="hero-section" class="relative rounded-3xl overflow-hidden mb-12 bg-cover bg-center shadow-xl hero-overlay">
      <div class="relative z-10 p-6 sm:p-12 lg:p-16 max-w-4xl">
        <span id="hero-badge" class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full text-xs font-bold bg-emerald-500/90 text-white mb-6"></span>
        <h1 id="hero-title" class="text-3xl sm:text-5xl font-extrabold text-white mb-6"></h1>
        <p id="hero-description" class="text-slate-200 text-base sm:text-lg mb-8"></p>
        <div id="hero-stats" class="grid grid-cols-2 sm:grid-cols-4 gap-3"></div>
      </div>
    </section>

    <section id="yerler" class="my-12">
      <div id="categories-container" class="grid grid-cols-1 md:grid-cols-2 gap-8"></div>
    </section>

    <div class="ad-in-article"><span>— Sponsorlu Reklam Alanı —</span></div>
    <section id="konaklama" class="my-12"><div id="accommodation-container"></div></section>
    <section id="ulasim" class="my-12"><div id="transport-container"></div></section>
  </main>

  <footer class="bg-slate-900 text-slate-400 py-10 mt-16 text-center text-sm">
    <p>© 2026 Gezi Rotası. Tüm hakları saklıdır.</p>
  </footer>

  <script src="assets/js/app.js"></script>
</body>
</html>
