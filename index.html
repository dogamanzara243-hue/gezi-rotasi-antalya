                    <button data-filter="all" class="filter-btn active bg-slate-900 text-white px-3.5 py-2 rounded-xl transition-all">Tümü</button>
                    <button data-filter="history" class="filter-btn bg-slate-100 hover:bg-slate-200 text-slate-700 px-3.5 py-2 rounded-xl transition-all">Tarih</button>
                    <button data-filter="sea" class="filter-btn bg-slate-100 hover:bg-slate-200 text-slate-700 px-3.5 py-2 rounded-xl transition-all">Manzara</button>

  <script src="assets/js/app.js"></script>

<script>
    // Otomatik Eklenen Kullanıcı Deneyimi ve Arama/Filtre İyileştirmesi
    document.addEventListener("DOMContentLoaded", () => {
        console.log("Gezi Rehberi Akıllı Arayüz Aktif 🚀");
        // Kartlara hover ve animasyon efekti desteği
        const cards = document.querySelectorAll('.grid > div');
        cards.forEach(card => {
            card.classList.add('transition-all', 'duration-300');
        });
    });
</script>


    <!-- Interaktif Arama, Filtreleme ve Back to Top Butonu Scripti -->
    <button id="back-to-top-btn" class="fixed bottom-6 right-6 z-50 bg-slate-900 text-white p-3.5 rounded-full shadow-2xl opacity-0 pointer-events-none transition-all duration-300 hover:scale-110 focus:outline-none" title="Yukarı Çık">
        <i class="fa-solid fa-arrow-up text-base"></i>
    </button>

    <script>
    document.addEventListener("DOMContentLoaded", () => {
        // Back to top butonu kontrolü
        const topBtn = document.getElementById("back-to-top-btn");
        if(topBtn) {
            window.addEventListener("scroll", () => {
                if (window.scrollY > 300) {
                    topBtn.classList.remove("opacity-0", "pointer-events-none");
                    topBtn.classList.add("opacity-100");
                } else {
                    topBtn.classList.add("opacity-0", "pointer-events-none");
                    topBtn.classList.remove("opacity-100");
                }
            });
            topBtn.addEventListener("click", () => {
                window.scrollTo({ top: 0, behavior: "smooth" });
            });
        }

        // Canlı Arama ve Filtreleme Mantığı
        const searchInput = document.getElementById("destination-search-input");
        const filterBtns = document.querySelectorAll(".filter-btn");

        function filterContent() {
            const query = searchInput ? searchInput.value.toLowerCase() : "";
            const activeBtn = document.querySelector(".filter-btn.active");
            const filterValue = activeBtn ? activeBtn.getAttribute("data-filter") : "all";

            const cards = document.querySelectorAll("#why-visit-cards > div, #must-see-items > div, .grid > div");
            cards.forEach(card => {
                const text = card.textContent.toLowerCase();
                const matchesSearch = text.includes(query);
                card.style.display = matchesSearch ? "" : "none";
            });
        }

        if(searchInput) searchInput.addEventListener("input", filterContent);

        filterBtns.forEach(btn => {
            btn.addEventListener("click", () => {
                filterBtns.forEach(b => {
                    b.classList.remove("active", "bg-slate-900", "text-white");
                    b.classList.add("bg-slate-100", "text-slate-700");
                });
                btn.classList.add("active", "bg-slate-900", "text-white");
                btn.classList.remove("bg-slate-100", "text-slate-700");
                filterContent();
            });
        });
    });
    </script>

</body>
</html>
