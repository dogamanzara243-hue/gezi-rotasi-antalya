<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ankara Gezi Rehberi - Gezi Rotası</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="min-h-screen flex flex-col justify-between">
  <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="#" class="flex items-center gap-2 font-extrabold text-xl text-slate-900"><i class="fa-solid fa-compass text-emerald-600 text-2xl"></i> Gezi Rotası</a>
      <a href="#yerler" class="cta-affiliate-btn !w-auto !py-2 !px-4 text-xs">Rotaları Keşfet</a>
    </div>
  </header>

  <div class="max-w-7xl mx-auto px-4 w-full pt-4">
    <div class="ad-banner-top"><span>— Reklam Alanı (970x90) —</span></div>
  </div>

  <main class="max-w-7xl mx-auto px-4 flex-grow w-full py-4">
    <section id="hero-section" class="relative rounded-3xl overflow-hidden mb-12 bg-cover bg-center shadow-xl hero-overlay">
      <div class="relative z-10 p-6 sm:p-12 lg:p-16 max-w-4xl">
        <span id="hero-badge" class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full text-xs font-bold bg-emerald-500/90 text-white mb-6"></span>
        <h1 id="hero-title" class="text-3xl sm:text-5xl font-extrabold text-white mb-6"></h1>
        <p id="hero-description" class="text-slate-200 text-base sm:text-lg mb-8"></p>
        <div id="hero-stats" class="grid grid-cols-2 sm:grid-cols-4 gap-3"></div>
      </div>
    </section>

    <section id="yerler" class="my-12">
      <div id="categories-container" class="grid grid-cols-1 md:grid-cols-2 gap-8"></div>
    </section>

    <div class="ad-in-article"><span>— Sponsorlu Reklam Alanı —</span></div>
    <section id="konaklama" class="my-12"><div id="accommodation-container"></div></section>
    <section id="ulasim" class="my-12"><div id="transport-container"></div></section>
  </main>

  <footer class="bg-slate-900 text-slate-400 py-10 mt-16 text-center text-sm">
    <p>© 2026 Gezi Rotası. Tüm hakları saklıdır.</p>
  </footer>

  <script src="assets/js/app.js"></script>
</body>
</html>
